<!DOCTYPE html><html lang="fr-CA"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | AGC Consultant</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--forest:#19221A;--green:#344531;--olive:#586024;--lime:#8AA125;--ivory:#EFEDEB;--ivory-2:#E5E3DF;--mineral:#A5A39F;--line:#CFCDC8;--ink-soft:#5A6154}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Space Grotesk",system-ui,sans-serif;background:var(--ivory);color:var(--forest);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .top{padding:26px 32px}.top img{height:44px}
  .main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;padding:40px 32px}
  .contours{position:absolute;inset:0;opacity:.5;pointer-events:none}
  .wrap{max-width:720px;margin:0 auto;position:relative;z-index:1;text-align:center}
  .code{font-family:"Space Mono";font-size:clamp(4.5rem,14vw,9rem);font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--forest)}
  .code b{color:var(--lime);font-weight:700}
  .kick{font-family:"Space Mono";font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--olive);margin:14px 0 18px;display:inline-block}
  h1{font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.03em;margin-bottom:16px}
  p.lead{font-size:1.1rem;color:var(--ink-soft);max-width:500px;margin:0 auto 32px}
  .cta{display:flex;gap:.8em;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
  .btn{display:inline-flex;align-items:center;gap:.6em;font-weight:600;font-size:.94rem;padding:.85em 1.5em;border-radius:999px;border:1.5px solid transparent;transition:transform .18s,background .18s,color .18s,border-color .18s}
  .btn .dot{width:7px;height:7px;background:var(--lime);border-radius:50%}
  .btn-primary{background:var(--forest);color:var(--ivory)}.btn-primary:hover{background:var(--green);transform:translateY(-2px)}
  .btn-outline{border-color:var(--forest);color:var(--forest)}.btn-outline:hover{border-color:var(--lime);color:var(--olive);transform:translateY(-2px)}
  .links{display:flex;gap:.4em 1.4em;justify-content:center;flex-wrap:wrap;font-family:"Space Mono";font-size:.74rem;letter-spacing:.04em;color:var(--olive)}
  .links a:hover{color:var(--forest)}
  footer{padding:22px 32px;font-family:"Space Mono";font-size:.7rem;letter-spacing:.06em;color:var(--mineral);text-align:center}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== AJUSTEMENTS RESPONSIVES (tablette + mobile) ===== */
@media(max-width:960px){
  /* Barre du haut : plus de chevauchement — pilule a gauche, portail a droite */
  .topbar{justify-content:space-between;padding:0 14px;gap:10px}
  .pill{padding:7px 7px 7px 14px;gap:6px;flex:0 1 auto;min-width:0}
  .pill .cta{display:none}
  .portal-fab{position:static;top:auto;right:auto;transform:none;flex:0 0 auto;white-space:nowrap}
  .portal-fab:hover{transform:translateY(-2px)}
  /* En-tetes de section : empiler le texte d'accompagnement */
  .sechead{flex-direction:column;gap:10px;margin-bottom:34px}
  .sechead p{margin-left:0;max-width:100%}
  /* Ruban de services : cartes plus hautes pour respirer */
  .rcard{height:210px}
  .rcard .c{padding:20px}
  .rcard h3{font-size:1.3rem}
}
@media(max-width:768px){
  .wrap{padding:0 22px}
  section.blk,.ribbon-sec{padding:64px 0}
  .foot-card{padding:26px 20px;border-radius:18px}
  .fc-top{margin-bottom:24px}
  .hero{min-height:auto;padding:104px 0 56px}
  .hero-sub{margin-bottom:26px}
  .hero-cta{gap:.6em}
  .hero-cta .btn{font-size:.88rem;padding:.75em 1.15em}
  .marq{padding:22px 0}
  .track{gap:44px}
  .track span{font-size:1.05rem}
}
@media(max-width:560px){
  .wrap{padding:0 18px}
  .pill .logo img{height:26px}
  .portal-fab{font-size:.7rem;padding:.5em .8em;gap:.4em;border-width:2px}
  section.blk,.ribbon-sec{padding:52px 0}
  .sechead h2{font-size:1.65rem}
  .sechead p{font-size:.98rem}
  /* Hero : titre lisible sans deborder */
  .hero h1{font-size:2.35rem;letter-spacing:-.03em}
  .hero-sub{font-size:1rem}
  .hero-cta{flex-direction:column;align-items:stretch}
  .hero-cta .btn{justify-content:center;width:100%}
  /* Ruban */
  .rcard{height:180px}
  .rcard h3{font-size:1.18rem}
  /* Chiffres cles */
  .stat .k{font-size:1.5rem}
  .stat p{font-size:.86rem}
  .calm h2{font-size:1.6rem}
  /* FAQ : zones tactiles plus grandes */
  details.faq-item summary{font-size:.98rem;padding:17px 0;gap:12px}
  details.faq-item p{font-size:.94rem;padding-bottom:17px}
  /* Formulaire */
  .w3form{padding:20px}
  .contact h2{font-size:1.65rem}
  .cinfo2 .row{flex-direction:column;gap:.2em}
  .cinfo2 .k{min-width:0}
  /* Affiliations */
  .aff-logos{flex-direction:column;gap:18px}
  .aff-item{max-width:100%}
  .aff-item img{height:46px}
  /* Pied de page */
  .fc-bottom{flex-direction:column;gap:8px;font-size:.64rem}
  .fc-pages{gap:12px}
  /* Pages de service : hero et cartes */
  .phero{padding:110px 0 48px}
  .phero h1{font-size:2.15rem}
  .phero .sub{font-size:1rem}
  .phero-imgs{gap:10px}
  .meta-row{gap:20px}
  .fcard{padding:22px}
  .fcard h3{font-size:1.1rem}
  /* Articles */
  .artbody .lead{font-size:1.1rem}
  .artbody p{font-size:1rem}
  .artbody h2{font-size:1.28rem}
  .artbody ol li{padding-left:38px}
  .narr .big{font-size:1.25rem}
  /* Blogue */
  .post .b{padding:18px}
  .post h3{font-size:1.06rem}
}
@media(max-width:400px){
  .wrap{padding:0 15px}
  .hero h1{font-size:2.05rem}
  .pill{padding:6px 6px 6px 11px}
  .portal-fab{font-size:.64rem;padding:.45em .7em}
  .portal-fab .d{width:5px;height:5px}
}
/* Confort tactile general */
@media(hover:none){
  .rcard:hover{flex:1}
  .rcard:hover .img img{transform:none}
}
/* ===== CONTRASTE SUR FONDS SOMBRES (lisibilite mobile) ===== */
/* L'olive #586024 sur le forest #19221A avait un ratio d'environ 2.4:1 :
   illisible. Sur fond sombre, les etiquettes passent au lime. */
.calm .lbl,.method.dark .lbl,.foot-sec .lbl,.programs .lbl,
.credential .lbl{color:var(--lime)}
.calm .lbl::before,.foot-sec .lbl::before,.programs .lbl::before{background:var(--lime)}
/* Textes secondaires : plus clairs pour respecter les seuils d'accessibilite */
.calm .stat p,.calm .lead,.programs .prog p{color:#C6CFBD}
.credential .deg,.credential .ci-v{color:#D2DACB}
.value p{color:#C0CAB6}
.artmeta{color:#B9C2AE}
@media(max-width:768px){
  /* Sur petit ecran, les petits textes gris deviennent illisibles : on monte
     la taille et on eclaircit encore. */
  .calm .stat p{font-size:.92rem;color:#CFD7C7}
  .calm .lead{font-size:1.04rem;color:#CFD7C7}
  .stat .k{font-size:1.6rem}
  .lbl{font-size:.7rem;letter-spacing:.16em}
  .credential .deg{font-size:1rem}
}
/* ===== LISIBILITE : MARGES MOBILES + CONTRASTE DES TITRES ===== */
/* 1. Marges laterales : 15-18px collait au bord de l'ecran. */
@media(max-width:768px){.wrap{padding:0 24px}}
@media(max-width:560px){.wrap{padding:0 22px}}
@media(max-width:400px){.wrap{padding:0 20px}}

/* 2. Titres et chapeau : encre profonde plutot que vert sur vert. */
.phero h1{color:#12151A}
.artbody .lead{color:#1E2124;font-weight:500}
.artbody h2{color:#14171A}
.sechead h2{color:#14171A}
.narr .big{color:#1E2124}
.fc-top h2,section.cta h2{color:#14171A}
/* Sur fond sombre, on garde le blanc. */
.calm h2,.faq .sechead h2,.calm .sechead h2{color:#FFFFFF}

/* 3. La puce lime des h2 passe DANS la marge, plus a l'exterieur. */
.artbody h2{padding-left:22px}
.artbody h2::before{left:0;top:.46em}
@media(max-width:768px){
  .artbody h2{padding-left:19px}
  .artbody h2::before{left:0;width:8px;height:8px}
}
/* ===== PROTECTION CONTRE LE MODE SOMBRE FORCE =====
   Certains navigateurs integres (Facebook, Instagram, visionneuses in-app)
   forcent un theme sombre. Les sections qui n'avaient pas de fond explicite
   heritaient alors du noir, rendant les titres fonces invisibles.
   On declare le schema clair ET on donne un fond explicite a chaque section. */
:root{color-scheme:light}
html,body{background:#EFEDEB !important;color-scheme:light}
/* Fonds explicites : plus rien n'herite */
.phero{background:#EFEDEB}
.narr{background:#EFEDEB}
section.blk{background:#EFEDEB}
.realisations{background:#EFEDEB}
.artbody{background:#FBFAF8}
.inc{background:#E5E3DF}
.method{background:#E5E3DF}
section.cta{background:#E5E3DF}
.contact{background:#E5E3DF}
.marq{background:#EFEDEB}
.ribbon-sec{background:#EFEDEB}
.faq{background:#19221A}
.calm{background:#19221A}
.foot-sec{background:#12160F}
.credential{background:#19221A}
/* Titres : forces en fonce sur les fonds clairs, en blanc sur les fonds sombres */
.phero h1,.artbody h2,.narr .big,.inc h2,section.cta h2,.contact h2{color:#12151A}
.sechead h2{color:#12151A}
.calm h2,.calm .sechead h2,.faq .sechead h2,.credential .who-name{color:#FFFFFF !important}
